name: Segment Prewarm (manifest, no-secret)

on:
  workflow_dispatch:
    inputs:
      movie_id:
        description: "Movie ID"
        required: true
        type: string

jobs:
  prewarm:
    name: Prewarm movie
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Run prewarm (no-secret)
        env:
          MOVIE_ID: ${{ github.event.inputs.movie_id }}
          HL_CFG: ${{ secrets.HL_CFG }}
        run: |
          cat > _pw.py <<'PY'
          import os, re, json, time, sys, base64
          import requests

          MID = os.environ["MOVIE_ID"].strip()
          VERBOSE = os.environ.get("VERBOSE_LOGS", "").lower() in ("1", "true", "yes")
          _cfg = json.loads(base64.b64decode(os.environ.get("HL_CFG", "").encode()).decode())
          CDN = _cfg["cdn_base"]
          REF = _cfg["pages"] + "/"
          UA = "Mozilla/5.0 (Homelander-Prewarm)"

          def g(url, headers=None, timeout=90):
              h = {"Referer": REF, "User-Agent": UA}
              if headers: h.update(headers)
              return requests.get(url, headers=h, timeout=timeout)

          m = g(f"{CDN}/manifests/{MID}.json?_pw={int(time.time())}", timeout=30)
          m.raise_for_status()
          mf = m.json()
          fa = mf.get("fallback_auth") or {}
          worker = (mf.get("workers") or [_cfg.get("worker_base")])[0]
          pl = g(mf["playlist_url"], timeout=30); pl.raise_for_status()
          segs = [l.strip() for l in pl.text.splitlines() if l.startswith("http") and "/segments/" in l]
          print(f"PREWARM | movie {MID if VERBOSE else MID[:4]+chr(8230)} | segments {len(segs)}")

          warm = cold = fail = 0
          for i, s in enumerate(segs):
              try:
                  r = g(s, headers={"Range": "bytes=0-0"}, timeout=30)
                  if r.status_code in (200, 206):
                      warm += 1; continue
                  obj = s.split("/segments/")[-1]
                  pr = g(f"{worker}/prepare/{obj}?mid={fa.get('movie_id')}&exp={fa.get('exp')}&sig={fa.get('sig')}", timeout=120)
                  if pr.status_code == 200:
                      r2 = g(s, headers={"Range": "bytes=0-1023"}, timeout=30)
                      if r2.status_code in (200, 206): warm += 1
                      else: cold += 1
                  else:
                      fail += 1
              except Exception:
                  fail += 1
              if (i+1) % 20 == 0:
                  print(f"  progress {i+1}/{len(segs)} | warm {warm} cold {cold} fail {fail}")
          print(f"PREWARM DONE | warm={warm} cold={cold} fail={fail}")
          PY
          python -u _pw.py
