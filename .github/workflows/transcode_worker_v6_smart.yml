name: Worker BotAPI Transcoder V6 Smart

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL / Google Drive URL / direct URL"
        required: true
        type: string
      title:
        description: "Movie title"
        required: true
        type: string
      hard_limit_mb:
        description: "Max file size MB (target)"
        required: false
        default: "15"
        type: string
      video_mode:
        description: "copy or encode"
        required: false
        default: "copy"
        type: choice
        options: [copy, encode]
      audio_mode:
        description: "aac or copy"
        required: false
        default: "aac"
        type: choice
        options: [aac, copy]
      max_parallel_uploads:
        description: "Parallel uploads"
        required: false
        default: "12"
        type: string
      force_worker_index:
        description: "1-based worker index; 0=auto"
        required: false
        default: "0"
        type: string

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run transcoder V6 smart
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          TITLE: ${{ inputs.title }}
          HARD_LIMIT_MB: ${{ inputs.hard_limit_mb }}
          VIDEO_MODE: ${{ inputs.video_mode }}
          AUDIO_MODE: ${{ inputs.audio_mode }}
          MAX_PARALLEL_UPLOADS: ${{ inputs.max_parallel_uploads }}
          FORCE_WORKER_INDEX: ${{ inputs.force_worker_index }}
          WORKER_BASE_URLS: ${{ secrets.WORKER_BASE_URLS }}
          PUBLIC_WATCH_BASE_URL: ${{ secrets.PUBLIC_WATCH_BASE_URL }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BOT_TOKENS_JSON: ${{ secrets.BOT_TOKENS_JSON }}
        run: python scripts/transcode_upload_worker_v6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcoder-output-v6
          path: |
            output/metadata.json
            output/worker_playlist.m3u8
            output/run_summary.txt
            output/ffmpeg.log
          if-no-files-found: ignore
